name: build

on:
  push:
    branches: [master, 'phase*']
  pull_request:
  workflow_dispatch:

env:
  # Package set documented in BUILDING.md, plus xvfb so the GUI clients can be
  # smoke-tested headlessly.
  XPILOT_DEPS: >-
    libx11-dev libsm-dev libice-dev
    libgl-dev libglu1-mesa-dev
    libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
    libexpat1-dev zlib1g-dev

jobs:
  cmake:
    name: CMake (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libgl1-mesa-dri gives Xvfb software GLX, which the SDL client needs
          # to create a GL context on a headless runner.
          # libgl1-mesa-dri gives Xvfb software GLX, which the SDL client needs
          # to create a GL context. xfonts-base supplies the fixed bitmap fonts
          # the X11 client asks for; without them it falls back and logs errors.
          sudo apt-get install -y --no-install-recommends \
              $XPILOT_DEPS xvfb libgl1-mesa-dri xfonts-base mesa-utils

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Check all five binaries were produced
        run: |
          set -eux
          for b in xpilot-ng-server xpilot-ng-x11 xpilot-ng-sdl \
                   xpilot-ng-replay xpilot-ng-xp-mapedit; do
            test -x "build/bin/$b"
          done

      - name: Build with sound enabled
        # The audio path is off by default, so without this it would never be
        # compiled in CI. That is exactly how the original audio code rotted:
        # SOUND was undefined for years and nobody noticed it had stopped
        # building. Compile-only; CI has no audio device to play through.
        run: |
          set -eux
          sudo apt-get install -y --no-install-recommends libsdl2-mixer-dev
          cmake -B build-sound -S . -DXPILOT_SOUND=ON
          cmake --build build-sound -j"$(nproc)"
          # The whole point of the phase: nothing links freealut any more.
          ! ldd build-sound/bin/xpilot-ng-sdl | grep -qiE 'openal|alut'
          ldd build-sound/bin/xpilot-ng-sdl | grep -q 'libSDL2_mixer'

      - name: Install
        # The clients look for textures and fonts under CONF_DATADIR
        # (/usr/local/share/xpilot-ng/), so install before smoke-testing them.
        # This exercises the install rules as a side effect.
        run: sudo cmake --install build

      - name: Smoke test — server with robots
        run: |
          set -eux
          ./build/bin/xpilot-ng-server \
              -map lib/maps/dodgers-robots.xp2 \
              -maxRobots 4 -minRobots 4 -port 15000 -noQuit -idleRun \
              > server.log 2>&1 &
          echo $! > server.pid
          sleep 10
          # The server exits when the last human leaves, so -noQuit is what
          # keeps it alive here; if it died, the log says why.
          kill -0 "$(cat server.pid)" || { cat server.log; exit 1; }
          grep -q "Server runs at" server.log || { cat server.log; exit 1; }

      - name: Smoke test — both clients connect
        run: |
          set -eux
          # Assert against the server log rather than the client's stdout: the
          # client block-buffers stdout and gets SIGTERMed without a flush, so
          # "Login allowed" is not reliably present in its own log. The server
          # is the authority on who actually connected.
          #
          # Nicknames stay short because the server truncates them to 15 chars.
          #
          # Xvfb gets GLX explicitly: the SDL client creates an OpenGL context
          # between the contact and login phases of the handshake, and if that
          # is slow or fails the server drops the half-open connection with
          # "timeout 01" before ever logging "Welcome".
          #
          # stdbuf keeps the client's output line-buffered so a failure is
          # actually diagnosable instead of being lost in the buffer.
          for c in xpilot-ng-x11 xpilot-ng-sdl; do
            nick="ci-${c##*-}"

            stdbuf -oL -eL xvfb-run -a \
                -s "-screen 0 1280x1024x24 +extension GLX +extension RANDR +render" \
                ./build/bin/"$c" -join -name "$nick" -port 15000 localhost \
                > "$c.log" 2>&1 &
            client_pid=$!

            # Poll for the server-side Welcome rather than waiting a fixed
            # period: a fast client passes immediately, a slow one still gets
            # the full budget.
            ok=0
            for _ in $(seq 1 60); do
              if grep -qi "Welcome $nick" server.log; then ok=1; break; fi
              if ! kill -0 "$client_pid" 2>/dev/null; then break; fi
              sleep 1
            done

            kill "$client_pid" 2>/dev/null || true
            wait "$client_pid" 2>/dev/null || true

            if [ "$ok" -ne 1 ]; then
              echo "=== $c never reached the server ==="
              cat "$c.log" || true
              echo "=== server log ==="
              cat server.log
              echo "=== glxinfo (is GLX actually working?) ==="
              xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX +render" \
                  glxinfo -B 2>&1 | head -20 || echo "glxinfo unavailable"
              exit 1
            fi
            echo "$c connected as $nick"
          done
          kill "$(cat server.pid)" || true

      - name: Smoke test — Python bot joins and survives 60s
        # Phase 6a's acceptance test. This exercises the whole handshake
        # against a real server: contact, queue, login port, verify, setup
        # drain, play. Each of those steps was a separate way to get silently
        # disconnected while writing it, so a regression here is likely and
        # worth catching.
        run: |
          set -eux
          pip install ./ai
          ./build/bin/xpilot-ng-server \
              -map lib/maps/blood-music.xp2 \
              -maxRobots 2 -minRobots 2 -port 15400 -noQuit -idleRun \
              > bot-server.log 2>&1 &
          echo $! > bot-server.pid
          sleep 5
          python -c "
from xpilot_bot.bots import wanderer
wanderer.run(host='localhost', port=15400, seconds=60.0)
print('bot survived 60s')
"
          # The server is the authority on whether the bot actually played.
          grep -q 'Welcome Wanderer' bot-server.log
          grep -q 'Wanderer.*starts at startpos' bot-server.log
          kill "$(cat bot-server.pid)" || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            *.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
