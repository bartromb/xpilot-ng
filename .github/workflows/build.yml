name: build

on:
  push:
    # Every branch. The filter used to be [master, 'phase*'], which meant a
    # branch named anything else pushed with no CI at all and looked fine --
    # which is exactly what happened to this one.
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  # Package set documented in BUILDING.md, plus xvfb so the GUI clients can be
  # smoke-tested headlessly.
  XPILOT_DEPS: >-
    libx11-dev libsm-dev libice-dev
    libgl-dev libglu1-mesa-dev
    libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev
    libexpat1-dev zlib1g-dev

jobs:
  cmake:
    name: CMake (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libgl1-mesa-dri gives Xvfb software GLX, which the SDL client needs
          # to create a GL context on a headless runner.
          # libgl1-mesa-dri gives Xvfb software GLX, which the SDL client needs
          # to create a GL context. xfonts-base supplies the fixed bitmap fonts
          # the X11 client asks for; without them it falls back and logs errors.
          sudo apt-get install -y --no-install-recommends \
              $XPILOT_DEPS xvfb libgl1-mesa-dri xfonts-base mesa-utils

      - name: Configure
        # Sound is explicit here rather than left to autodetection, so the
        # .deb this job publishes always has audio in it -- it is the build
        # that ships, and it should not depend on what the runner happens to
        # have installed.
        #
        # The prefix has to be /usr, because that is where CPack lays the .deb
        # out (CPACK_PACKAGING_INSTALL_PREFIX). Building with the default
        # /usr/local baked /usr/local/share/xpilot-ng/ into the binaries while
        # the package put its data in /usr/share/xpilot-ng/, so an installed
        # .deb found none of its own maps, textures, fonts or sounds. It only
        # looked fine on a machine that had also been `cmake --install`ed by
        # hand.
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DXPILOT_SOUND=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Check all five binaries were produced
        run: |
          set -eux
          for b in xpilot-ng-server xpilot-ng-x11 xpilot-ng-sdl \
                   xpilot-ng-replay xpilot-ng-xp-mapedit; do
            test -x "build/bin/$b"
          done

      - name: Check the shipped client really has audio linked in
        # This used to configure and build a second tree just to prove the
        # audio path still compiled, while the tree that was packaged had no
        # sound at all -- so CI was green and the .deb was mute. Sound is on
        # in the build above now, so assert against that one and skip the
        # duplicate build.
        run: |
          set -eux
          # The whole point of the phase: nothing links freealut any more.
          ! ldd build/bin/xpilot-ng-sdl | grep -qiE 'openal|alut'
          ldd build/bin/xpilot-ng-sdl | grep -q 'libSDL2_mixer'
          # And the samples the client plays have to be installed with it.
          test -f lib/sound/sounds.txt

      - name: Install
        # The clients look for textures and fonts under CONF_DATADIR
        # (/usr/local/share/xpilot-ng/), so install before smoke-testing them.
        # This exercises the install rules as a side effect.
        run: sudo cmake --install build

      - name: Smoke test — server with robots
        run: |
          set -eux
          ./build/bin/xpilot-ng-server \
              -map lib/maps/dodgers-robots.xp2 \
              -maxRobots 4 -minRobots 4 -port 15000 -noQuit -idleRun \
              > server.log 2>&1 &
          echo $! > server.pid
          sleep 10
          # The server exits when the last human leaves, so -noQuit is what
          # keeps it alive here; if it died, the log says why.
          kill -0 "$(cat server.pid)" || { cat server.log; exit 1; }
          grep -q "Server runs at" server.log || { cat server.log; exit 1; }

      - name: Smoke test — both clients connect
        run: |
          set -eux
          # Assert against the server log rather than the client's stdout: the
          # client block-buffers stdout and gets SIGTERMed without a flush, so
          # "Login allowed" is not reliably present in its own log. The server
          # is the authority on who actually connected.
          #
          # Nicknames stay short because the server truncates them to 15 chars.
          #
          # Xvfb gets GLX explicitly: the SDL client creates an OpenGL context
          # between the contact and login phases of the handshake, and if that
          # is slow or fails the server drops the half-open connection with
          # "timeout 01" before ever logging "Welcome".
          #
          # stdbuf keeps the client's output line-buffered so a failure is
          # actually diagnosable instead of being lost in the buffer.
          for c in xpilot-ng-x11 xpilot-ng-sdl; do
            nick="ci-${c##*-}"

            stdbuf -oL -eL xvfb-run -a \
                -s "-screen 0 1280x1024x24 +extension GLX +extension RANDR +render" \
                ./build/bin/"$c" -join -name "$nick" -port 15000 localhost \
                > "$c.log" 2>&1 &
            client_pid=$!

            # Poll for the server-side Welcome rather than waiting a fixed
            # period: a fast client passes immediately, a slow one still gets
            # the full budget.
            ok=0
            for _ in $(seq 1 60); do
              if grep -qi "Welcome $nick" server.log; then ok=1; break; fi
              if ! kill -0 "$client_pid" 2>/dev/null; then break; fi
              sleep 1
            done

            kill "$client_pid" 2>/dev/null || true
            wait "$client_pid" 2>/dev/null || true

            if [ "$ok" -ne 1 ]; then
              echo "=== $c never reached the server ==="
              cat "$c.log" || true
              echo "=== server log ==="
              cat server.log
              echo "=== glxinfo (is GLX actually working?) ==="
              xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX +render" \
                  glxinfo -B 2>&1 | head -20 || echo "glxinfo unavailable"
              exit 1
            fi
            echo "$c connected as $nick"
          done
          kill "$(cat server.pid)" || true

      - name: Smoke test — Python bot joins and survives 60s
        # Phase 6a's acceptance test. This exercises the whole handshake
        # against a real server: contact, queue, login port, verify, setup
        # drain, play. Each of those steps was a separate way to get silently
        # disconnected while writing it, so a regression here is likely and
        # worth catching.
        run: |
          set -eux
          pip install ./ai
          ./build/bin/xpilot-ng-server \
              -map lib/maps/blood-music.xp2 \
              -maxRobots 2 -minRobots 2 -port 15400 -noQuit -idleRun \
              > bot-server.log 2>&1 &
          echo $! > bot-server.pid
          sleep 5
          python -c "from xpilot_bot.bots import wanderer; wanderer.run(host='localhost', port=15400, seconds=60.0); print('bot survived 60s')"
          # The server is the authority on whether the bot actually played.
          grep -q 'Welcome Wanderer' bot-server.log
          grep -q 'Wanderer.*starts at startpos' bot-server.log
          # Surviving 60s is not the same as being connected for 60s. A client
          # that stops acknowledging the reliable stream is dropped by the
          # server with a retransmit timeout, which the bot experiences as an
          # ordinary quiet exit -- that is exactly how the piggybacked-segment
          # bug hid for so long. The server says so in its log; check it.
          if grep -q 'Goodbye.*timeout' bot-server.log; then
            echo "server dropped the bot on a timeout:"
            grep 'Goodbye' bot-server.log
            exit 1
          fi
          kill "$(cat bot-server.pid)" || true

      - name: Reliable stream decodes against a live server
        # The frame stream carries positions; this one carries everything the
        # game means by an outcome. It is fed by a network, so the cases that
        # break it -- out-of-order segments, retransmissions, packets split
        # across segments -- are ordinary traffic rather than edge cases.
        run: |
          set -eux
          # The env tests import gymnasium and numpy, which live in the rl
          # extra rather than in the client's (deliberately empty) base deps.
          pip install "./ai[rl]" pytest
          python -m pytest ai/tests -q
          ./build/bin/xpilot-ng-server \
              -map lib/maps/dodgers-robots.xp2 \
              -maxRobots 3 -minRobots 3 -port 15401 -noQuit -idleRun \
              > rel-server.log 2>&1 &
          echo $! > rel-server.pid
          sleep 5
          python ai/tools/check_reliable.py --port 15401 --seconds 45
          kill "$(cat rel-server.pid)" || true

      - name: Package (.deb)
        # CPack has been configured since the autotools removal but nothing
        # ever ran it in CI, so releases had no Linux artifact to attach.
        #
        # The earlier install-parity step runs `sudo cmake --install`, which
        # leaves a root-owned install_manifest.txt in the build tree. cpack
        # rewrites that file as the normal user and fails with a permission
        # error that says nothing about why.
        run: |
          set -eux
          sudo rm -f build/install_manifest.txt
          cd build
          cpack -G DEB
          dpkg-deb -I ./*.deb
          # The data directory compiled into the client must be one the
          # package actually ships, or the .deb installs a game that cannot
          # find its own files.
          datadir=$(strings bin/xpilot-ng-sdl \
                    | grep -m1 -oE '/[a-z/]*/share/xpilot-ng/')
          echo "client looks for data in $datadir"
          dpkg-deb -c ./*.deb | grep -q "\.${datadir}defaults.txt"
          dpkg-deb -c ./*.deb | grep -q "\.${datadir}sound/sounds.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: xpilot-ng-linux-amd64-deb
          path: build/*.deb

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            *.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Windows. MSYS2/mingw64 because it packages the whole SDL2 family and
  # expat, so this is a plain CMake build rather than a dependency hunt.
  # Only the server and the SDL client are built: the X11 client, replay
  # tool and map editor are Xlib programs.
  # ---------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-nsis

      - name: Configure
        # XPILOT_PORTABLE lays the install out self-contained -- binaries at
        # the root, data in lib/ beside them -- which is what both the .zip
        # and the installer ship, and what the relative CONF_DATADIR on
        # Windows expects to find.
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DXPILOT_PORTABLE=ON \
            -DXPILOT_SOUND=ON

      - name: Build
        run: cmake --build build -j

      - name: The binaries exist and are Windows executables
        run: |
          set -eux
          test -f build/bin/xpilot-ng-server.exe
          test -f build/bin/xpilot-ng-sdl.exe
          file build/bin/*.exe

      - name: Server starts and answers a ping
        # A binary that links is not a binary that runs.
        #
        # Two Windows-specific traps here, both of which reported a healthy
        # server as dead. MSYS2 ships a POSIX netstat that reads /proc/net
        # and cannot see native Windows sockets, so netstat.exe is called by
        # full path. And MSYS2 tracks native (non-MSYS) child processes
        # loosely, so `kill -0 $!` is not evidence of anything -- tasklist is
        # asked instead.
        run: |
          set -ux
          ./build/bin/xpilot-ng-server.exe -map lib/maps/dodgers-robots.xp2 \
              -port 15345 -maxRobots 1 -minRobots 1 -noQuit -idleRun \
              > server.log 2>&1 &
          sleep 12

          echo "--- server output ---"
          cat server.log || true

          echo "--- is the process there? ---"
          /c/Windows/System32/tasklist.exe | grep -i xpilot || true

          echo "--- is the port open? ---"
          if /c/Windows/System32/netstat.exe -an | grep -E "15345"; then
            echo "server is listening"
            exit 0
          fi

          echo "server is NOT listening; UDP table:"
          /c/Windows/System32/netstat.exe -an | grep -i udp | head -30
          exit 1

      - name: Package
        run: |
          set -eux
          # Install rather than copy, so the package gets the curated data
          # set the install rules define, laid out the way the binaries
          # expect.
          cmake --install build --prefix "$PWD/dist/xpilot-ng-windows"

          # MSYS2 binaries need their runtime DLLs alongside them, and the
          # union over *every* executable -- not just the client. The server
          # is the one that links expat, so collecting only the client's
          # dependencies shipped a build whose server could not start:
          # "libexpat-1.dll not found". Found by downloading the artifact and
          # running it, which is the only way that shows up.
          for exe in build/bin/*.exe; do ldd "$exe"; done \
            | grep -i mingw64 | awk '{print $3}' | sort -u \
            | xargs -I{} cp -n {} dist/xpilot-ng-windows/

          cp COPYING README.md BUILDING.md dist/xpilot-ng-windows/

      - name: Every dependency is actually in the package
        # Guards the mistake above: walk each packaged executable's imports
        # and fail if one is missing from the directory we are about to ship.
        run: |
          set -eu
          cd dist/xpilot-ng-windows
          missing=0
          for exe in *.exe; do
            for dep in $(ldd "$exe" | grep -i mingw64 | awk '{print $1}'); do
              if [ ! -f "$dep" ]; then
                echo "MISSING: $exe needs $dep"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all $(ls *.dll | wc -l) DLLs present for $(ls *.exe | wc -l) executables"

      - name: The packaged client finds its data from any directory
        # The whole point of Conf_anchor_datadir(): a Start Menu shortcut does
        # not run the game from its own folder. Start the server from
        # somewhere else entirely and check it still loads its map.
        run: |
          set -eux
          cd /
          "$GITHUB_WORKSPACE/dist/xpilot-ng-windows/xpilot-ng-server.exe" \
              -map blood-music.xp2 -port 15346 -noQuit -idleRun \
              > "$GITHUB_WORKSPACE/anchored.log" 2>&1 &
          sleep 10
          cat "$GITHUB_WORKSPACE/anchored.log" || true
          /c/Windows/System32/netstat.exe -an | grep -E "15346"

      - name: Build the installer
        run: |
          set -eux
          # Take the version from the one place that defines it, so the
          # installer cannot drift from the build it wraps.
          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9.]\+\).*/\1/p' \
                    CMakeLists.txt | head -1)
          test -n "$version"
          # NSIS is a native Windows program: it cannot open the POSIX
          # paths an MSYS2 shell produces, so convert them.
          src=$(cygpath -w "$PWD/dist/xpilot-ng-windows")
          lic=$(cygpath -w "$PWD/COPYING")
          out=$(cygpath -w "$PWD/dist/xpilot-ng-$version-setup-x86_64.exe")
          makensis -V2 \
            -DVERSION="$version" \
            -DSOURCE_DIR="$src" \
            -DLICENSE_FILE="$lic" \
            -DOUT_FILE="$out" \
            packaging/windows/xpilot-ng.nsi
          test -f "dist/xpilot-ng-$version-setup-x86_64.exe"
          ls -la dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: xpilot-ng-windows-x86_64
          path: dist/xpilot-ng-windows

      - uses: actions/upload-artifact@v4
        with:
          name: xpilot-ng-windows-installer
          path: dist/xpilot-ng-*-setup-x86_64.exe

  # ---------------------------------------------------------------------
  # macOS. Homebrew has the SDL2 family; zlib comes with the SDK.
  # Same subset as Windows, and for the same reason.
  #
  # Two runners because a Mac binary is per-architecture: macos-14 is Apple
  # Silicon, macos-15-intel is Intel. (macos-13 was the old Intel image and
  # is being retired -- a job asking for it sits queued indefinitely rather
  # than failing, which is a slow way to find out.) Homebrew installs for the
  # host architecture
  # only, so a universal binary would need two sets of dependencies -- two
  # builds is the honest way to cover both. Homebrew also lives somewhere
  # different on each (/opt/homebrew against /usr/local), which is why
  # nothing here hardcodes the prefix.
  # ---------------------------------------------------------------------
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    name: macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja pkgconf sdl2 sdl2_ttf sdl2_image sdl2_mixer expat
          brew install dylibbundler

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DXPILOT_PORTABLE=ON \
            -DXPILOT_SOUND=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix expat);$(brew --prefix)"

      - name: Build
        run: cmake --build build -j

      - name: The binaries exist and are Mach-O executables of the right arch
        run: |
          set -eux
          test -x build/bin/xpilot-ng-server
          test -x build/bin/xpilot-ng-sdl
          file build/bin/xpilot-ng-server build/bin/xpilot-ng-sdl
          # A silently-wrong architecture would produce an artifact that
          # cannot run on the machines it is named for.
          file build/bin/xpilot-ng-sdl | grep -q "${{ matrix.arch }}"

      - name: Server starts and answers a ping
        run: |
          set -eux
          ./build/bin/xpilot-ng-server -map lib/maps/dodgers-robots.xp2 \
              -port 15345 -maxRobots 1 -minRobots 1 -noQuit -idleRun &
          sleep 8
          lsof -iUDP:15345 || (echo "server is not listening"; exit 1)

      - name: Package
        run: |
          set -eux
          # Install rather than copy, so the package gets the curated data
          # set, laid out the way the binaries expect to find it.
          cmake --install build --prefix "$PWD/dist/xpilot-ng-macos"
          mkdir -p dist/xpilot-ng-macos/libs

          # Without this the binaries carry absolute Homebrew paths --
          # /opt/homebrew/opt/sdl2-compat/lib/libSDL2-2.0.0.dylib and friends
          # -- and refuse to start on any Mac that does not happen to have
          # the same formulae installed in the same place. dylibbundler
          # copies the non-system dependencies in and rewrites the load
          # commands to @executable_path, recursively, because those dylibs
          # have dependencies of their own.
          for exe in dist/xpilot-ng-macos/xpilot-ng-server \
                     dist/xpilot-ng-macos/xpilot-ng-sdl; do
            dylibbundler -od -b -x "$exe" \
              -d dist/xpilot-ng-macos/libs -p @executable_path/libs/
          done

          cp COPYING README.md BUILDING.md dist/xpilot-ng-macos/

      - name: Nothing still points at Homebrew
        # The check that would have caught the shipped-without-expat mistake
        # on the Windows side: ask the binaries themselves what they load.
        run: |
          set -eu
          cd dist/xpilot-ng-macos
          bad=0
          for f in xpilot-ng-server xpilot-ng-sdl libs/*.dylib; do
            if otool -L "$f" | tail -n +2 \
                 | grep -E "/opt/homebrew|/usr/local/(opt|Cellar)"; then
              echo "STILL EXTERNAL: $f"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "self-contained: $(ls libs/*.dylib | wc -l) bundled dylibs"

      - name: The packaged server finds its data from any directory
        # Same check as the Windows job: an app launched from Finder does not
        # run from its own folder, so Conf_anchor_datadir() has to work.
        run: |
          set -eux
          cd /
          "$GITHUB_WORKSPACE/dist/xpilot-ng-macos/xpilot-ng-server" \
              -map blood-music.xp2 -port 15346 -noQuit -idleRun \
              > "$GITHUB_WORKSPACE/anchored.log" 2>&1 &
          sleep 8
          cat "$GITHUB_WORKSPACE/anchored.log" || true
          lsof -iUDP:15346 || (echo "did not find its map"; exit 1)

      - name: Build the .dmg
        run: |
          set -eux
          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9.]*\).*/\1/p' \
                    CMakeLists.txt | head -1)
          test -n "$version"
          mkdir -p dist/dmg
          packaging/macos/make-dmg.sh \
            dist/xpilot-ng-macos "$version" "${{ matrix.arch }}" \
            "dist/dmg/xpilot-ng-$version-macos-${{ matrix.arch }}.dmg"
          ls -la dist/dmg

      - name: The .dmg contains an app that is actually complete
        # A .dmg that mounts is not a .dmg that runs. Mount it and check the
        # bundle has its executable, its data and its bundled libraries, and
        # that nothing inside still points at Homebrew.
        run: |
          set -eux
          hdiutil attach dist/dmg/*.dmg -mountpoint /tmp/xpdmg -nobrowse -readonly
          app="/tmp/xpdmg/XPilot NG.app"
          test -x "$app/Contents/MacOS/xpilot-ng-sdl"
          test -x "$app/Contents/MacOS/xpilot-ng-server"
          test -f "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/lib/defaults.txt"
          test -f "$app/Contents/Resources/lib/sound/sounds.txt"
          test -d "$app/Contents/MacOS/libs"
          plutil -lint "$app/Contents/Info.plist"
          ! otool -L "$app/Contents/MacOS/xpilot-ng-sdl" | tail -n +2 \
            | grep -E "/opt/homebrew|/usr/local/(opt|Cellar)"
          # And it runs from inside the mounted image, where the working
          # directory is nothing like the bundle.
          cd /
          "$app/Contents/MacOS/xpilot-ng-server" -map blood-music.xp2 \
              -port 15347 -noQuit -idleRun > /tmp/dmg-run.log 2>&1 &
          srv=$!
          sleep 8
          cat /tmp/dmg-run.log || true
          lsof -iUDP:15347 || (echo "app cannot find its data"; exit 1)
          # The server anchored itself into the mounted image, so it holds the
          # volume open. Stop it before unmounting, or detach fails busy.
          kill "$srv" 2>/dev/null || true
          wait "$srv" 2>/dev/null || true
          hdiutil detach /tmp/xpdmg || hdiutil detach -force /tmp/xpdmg

      - uses: actions/upload-artifact@v4
        with:
          name: xpilot-ng-macos-${{ matrix.arch }}
          path: dist/xpilot-ng-macos

      - uses: actions/upload-artifact@v4
        with:
          name: xpilot-ng-macos-${{ matrix.arch }}-dmg
          path: dist/dmg/*.dmg
